name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Gold recordings are current
        run: uv run claimgraph gold record vitamin-d-depression
      - name: Extraction eval
        run: |
          set -o pipefail
          uv run claimgraph eval extraction vitamin-d-depression | tee -a "$GITHUB_STEP_SUMMARY"
          uv run claimgraph eval models vitamin-d-depression --second-run replay/second-run \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Normalization eval
        run: |
          set -o pipefail
          uv run claimgraph eval normalization vitamin-d-depression | tee -a "$GITHUB_STEP_SUMMARY"
          uv run claimgraph eval normalization vitamin-d-depression --baseline \
            | tee -a "$GITHUB_STEP_SUMMARY"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Types, tests and build
        run: npm run check
      # The runner's installed Chrome; nothing is downloaded.
      - name: Browser checks
        run: npm run e2e
