# Prices in US dollars per million tokens, standard rates, each model's from its vendor's own
# page (below). Update the date with the numbers; the dry run and the cost report read them.
checked = 2026-11-16
# All three vendors' batch APIs bill every token at this share, cache reads and writes included.
batch_discount = 0.5
# Haiku 5.5 bills longer prompts at a higher tier, so the estimate refuses them.
max_prompt_tokens = 100000

# Claude: https://platform.claude.com/docs/en/about-claude/pricing, for prompts of up to 100,000
# tokens. Cache writes are for the five-minute cache.
[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_write = 0.125
cache_read = 0.01

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.10

# The council's other vendors, for prompts of up to 272,000 and 200,000 tokens; classification
# prompts are far shorter.
# OpenAI: https://developers.openai.com/api/docs/pricing. Cache writes are 1.25 times input.
[models."gpt-6.1-sol"]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.10

# Google: https://aistudio.google.com/docs/pricing. Rates through 2026-11-30; they double on
# 2026-12-01. Caching is implicit only, with no write charge, so a write is billed as input.
[models.gemini-4-argon]
input = 2.00
output = 10.00
cache_write = 2.00
cache_read = 0.10
