# Synthetic example of outcome-pair labels.
[[pair]]
a = "synthetic depression score"
b = "synthetic depressive symptoms"
verdict = "merge"

[[pair]]
a = "synthetic depression incidence"
b = "synthetic depression score"
verdict = "separate"
note = "Incidence and severity are different outcomes."

[[pair]]
a = "synthetic depression score"
b = "synthetic distress and anxiety score"
verdict = "out_of_domain"
note = "A measure combining depression with anxiety is not an outcome in the domain."
