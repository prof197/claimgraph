# Corrections to the contradiction labels, each accepted by the maintainer. `found` says when:
# a correction made after the eval was first scored can only have been looked for with the
# scores in view, so the README reports the rates before and after those.

[[correction]]
outcome = "Depressive symptoms"
study_a = "36032243"
study_b = "39125485"
was_verdict = "apparent"
was_reason = "outcome_measure"
was_also_differs = []
found = "before_scoring"
rule = "A supplement whose fields never name vitamin D is off the question, and that is checked first"

