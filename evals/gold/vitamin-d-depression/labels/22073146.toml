# Effects of vitamin D supplementation on cognitive and emotional functioning in young adults--a randomised controlled trial.
# PMID 22073146, PLoS One 2011. Publication types: Journal Article, Randomized Controlled Trial, Research Support, Non-U.S. Gov't.
# Sampled as trial; screened on topic.
#
# BACKGROUND: Epidemiological research links vitamin D status to various brain-related outcomes.
# However, few trials examine whether supplementation can improve such outcomes and none have
# examined effects on cognition. This study examined whether Vitamin D supplementation led to
# improvements in diverse measures of cognitive and emotional functioning, and hypothesised that
# supplementation would lead to improvements in these outcomes compared to placebo.
# METHODS/PRINCIPAL FINDINGS: Healthy young adults were recruited to a parallel-arm, double-blind
# trial conducted at The University of Queensland. Participants were randomly allocated to receive
# Vitamin D (one capsule daily, containing 5000 IU cholecalciferol) or identical placebo capsule
# for six weeks. All participants and outcome assessors were blinded to group assignment. Primary
# outcome measures assessed at baseline and 6 weeks were working memory, response inhibition and
# cognitive flexibility. Secondary outcomes were: hallucination-proneness, psychotic-like
# experiences, and ratings of depression, anxiety and anger. 128 participants were recruited,
# randomised and included in primary analyses (vitamin D n = 63; placebo n = 65). Despite
# significant increases in vitamin D status in the active group, no significant changes were
# observed in working memory (F = 1.09; p = 0.30), response inhibition (F = 0.82; p = 0.37),
# cognitive flexibility (F = 1.37; p = 0.24) or secondary outcomes. No serious adverse effects
# were reported.
# CONCLUSIONS: Our findings indicate that vitamin D supplementation does not influence cognitive
# or emotional functioning in healthy young adults. Future controlled trials in targeted
# populations of interest are required to determine whether supplementation can improve
# functioning in these domains. Australian and New Zealand Clinical Trials Registry;
# ACTRN12610000318088.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "22073146"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "rct"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 128

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "yes"
concurrent_comparison = "yes"
by_chance = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''Despite significant increases in vitamin D status in the active group, no significant changes were observed in working memory (F = 1.09; p = 0.30), response inhibition (F = 0.82; p = 0.37), cognitive flexibility (F = 1.37; p = 0.24) or secondary outcomes.'''
outcome_reported = "ratings of depression"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
