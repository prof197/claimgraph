# Vitamin D and probiotic co-supplementation affects mental health, hormonal, inflammatory and oxidative stress parameters in women with polycystic ovary syndrome.
# PMID 30665436, J Ovarian Res 2019. Publication types: Journal Article, Randomized Controlled Trial.
# Sampled as trial; screened on topic.
#
# OBJECTIVE: The aim of this study was to determine the effect of vitamin D and probiotic co-
# administration on mental health, hormonal, inflammatory and oxidative stress parameters in women
# with polycystic ovary syndrome (PCOS).
# METHODS: This randomized, double-blinded, placebo-controlled clinical trial was carried out on
# 60 subjects, aged 18-40 years old. Subjects were randomly allocated to take either 50,000 IU
# vitamin D every 2 weeks plus 8 × 109 CFU/day probiotic (n = 30) or placebo (n = 30) for 12
# weeks.
# RESULTS: Vitamin D and probiotic co-supplementation, compared with the placebo, significantly
# improved beck depression inventory [β (difference in the mean of outcomes measures between
# treatment groups) - 0.58; 95% CI, - 1.15, - 0.02; P = 0.04], general health questionnaire scores
# (β - 0.93; 95% CI, - 1.78, - 0.08; P = 0.03) and depression, anxiety and stress scale scores (β
# - 0.90; 95% CI, - 1.67, - 0.13; P = 0.02). Vitamin D and probiotic co-supplementation was
# associated with a significant reduction in total testosterone (β - 0.19 ng/mL; 95% CI, - 0.28, -
# 0.10; P < 0.001), hirsutism (β - 0.95; 95% CI, - 1.39, - 0.51; P < 0.001), high-sensitivity
# C-reactive protein (hs-CRP) (β - 0.67 mg/L; 95% CI, - 0.97, - 0.38; P < 0.001) and
# malondialdehyde (MDA) levels (β - 0.25 μmol/L; 95% CI, - 0.40, - 0.10; P = 0.001), and a
# significant increase in total antioxidant capacity (TAC) (β 82.81 mmol/L; 95% CI, 42.86, 122.75;
# P < 0.001) and total glutathione (GSH) levels (β 40.42 μmol/L; 95% CI, 4.69, 76.19; P = 0.02),
# compared with the placebo.
# CONCLUSIONS: Overall, the co-administration of vitamin D and probiotic for 12 weeks to women
# with PCOS had beneficial effects on mental health parameters, serum total testosterone,
# hirsutism, hs-CRP, plasma TAC, GSH and MDA levels.
# TRIAL REGISTRATION: This study was retrospectively registered in the Iranian website (
# www.irct.ir ) for registration of clinical trials ( IRCT20170513033941N37 ).
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "30665436"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "rct"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 60

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "yes"
concurrent_comparison = "yes"
by_chance = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''Vitamin D and probiotic co-supplementation, compared with the placebo, significantly improved beck depression inventory [β (difference in the mean of outcomes measures between treatment groups) - 0.58; 95% CI, - 1.15, - 0.02; P = 0.04], general health questionnaire scores (β - 0.93; 95% CI, - 1.78, - 0.08; P = 0.03) and depression, anxiety and stress scale scores (β - 0.90; 95% CI, - 1.67, - 0.13; P = 0.02).'''
outcome_reported = "BDI"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
