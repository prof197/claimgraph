# Association between Edinburgh Postnatal Depression Scale and Serum Levels of Ketone Bodies and Vitamin D, Thyroid Function, and Iron Metabolism.
# PMID 36771476, Nutrients 2023. Publication types: Journal Article.
# Sampled as observational; screened on topic.
#
# Suicide due to postpartum depression is the most common perinatal-related death and is a social
# concern in Japan. Nutritional deficiencies during pregnancy may contribute to postpartum
# depression; therefore, we investigated the relationship between postpartum depression and
# nutritional status during pregnancy and postpartum. We focused specifically on ketone bodies
# because they are known to protect brain cells. The relationship between the Edinburgh Postnatal
# Depression Scale (EPDS) scores and the serum levels of ketone bodies and vitamin D, thyroid
# function, and iron metabolism was examined. Overall, 126 pregnant women were identified for the
# study, and 99 were eventually included in the analysis. We defined an EPDS score of ≥9 as being
# positive for postpartum depression, and serum ketone levels were found to be higher in the group
# with an EPDS score of ≥9 during the second trimester; however, there were no other significant
# findings. We may be able to predict postpartum depression from a pregnant woman's serum ketone
# levels in the second trimester. There was a positive correlation between the EPDS scores at 3
# days and 1 month postpartum (r = 0.534, p < 0.001). EPDS scores assessed in the early postpartum
# period may be useful for the timely detection of postpartum depression.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "36771476"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "cross_sectional"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 126

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "no"
measured_before = "no"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''We defined an EPDS score of ≥9 as being positive for postpartum depression, and serum ketone levels were found to be higher in the group with an EPDS score of ≥9 during the second trimester; however, there were no other significant findings.'''
outcome_reported = "EPDS"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
