# Mid-life serum Vitamin D concentrations were associated with incident dementia but not late-life neuropsychological performance in the Atherosclerosis Risk in Communities (ARIC) Study.
# PMID 31640594, BMC Neurol 2019. Publication types: Clinical Trial, Journal Article.
# Sampled as trial; screened on topic.
#
# BACKGROUND: Activated Vitamin D has anti-inflammatory properties and adequate 25-hydroxyvitamin
# D [25(OH)D] concentrations may be important for neurocognitive function and protection against
# neurologic injury. We examined whether mid-life 25(OH) D concentrations were associated with
# later-life performance on neuropsychological testing, functional ability, depressive symptoms,
# and incident dementia.
# METHODS: We studied 13,039 white and black ARIC participants who had serum 25(OH) D measured
# mid-life at visit 2 (1990-1992). Over the next ~ 20 years through visit 5 (2011-2013),
# participants underwent 3 additional in-person visits, annual telephone calls, and
# hospitalization surveillance. An extensive battery of neuropsychological outcomes were assessed
# at visit 5 using standardized protocols. Incident dementia was ascertained through a formal
# algorithm that included data from in-person cognitive testing, telephone interviews, hospital
# discharge codes, and death certificate codes. Diagnoses of dementia were adjudicated by expert
# clinician committee. For the primary cognitive analyses, we imputed for missing covariates and
# outcomes and used linear regression to evaluate non-concurrent cross-sectional associations of
# mid-life 25(OH) D (visit 2) with late-life neuropsychological outcomes (visit 5). We also used
# Cox regression models to examine associations of mid-life 25(OH) D and incident dementia.
# RESULTS: In mid-life, the mean (SD) age of participants was 57 (6) years, 57% were women, and
# 24% black. Mean (SD) 25(OH) D was 24.3 (8.6) ng/mL; 33% had deficient (< 20 ng/mL), 44%
# intermediate (20- < 30 ng/mL), and 23% sufficient (≥30 ng/mL) 25(OH) D concentrations.
# Association between mid-life 25(OH) D and late-life performance on neuropsychological testing
# were mostly null. There was no significant association with functional ability or depressive
# symptoms. Results were similar in a sensitivity analysis using complete-case data (no
# imputation). However, after a median follow-up of 20 years, low 25(OH) D concentrations were
# associated with increased risk for incident dementia (p = 0.01 for trend across categories),
# with HR of 1.26 (95% CI 1.06, 1.49) for participants with deficient 25(OH) D, compared to
# sufficient concentrations.
# CONCLUSION: In this community cohort, mid-life serum 25(OH) D concentrations were associated
# with incident dementia but not with performance on neuropsychological testing, functional
# ability, or depressive symptoms, 20 years later. Whether serum 25(OH) D concentrations are
# causally related to dementia or confounded by poorer health status remains uncertain.
# TRIAL REGISTRATION: Registered on clinicaltrials.gov NCT00005131 .
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "31640594"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "cohort"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 13039

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "no"
measured_before = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''There was no significant association with functional ability or depressive symptoms.'''
outcome_reported = "depressive symptoms"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "at_or_above_20_ng_ml"
