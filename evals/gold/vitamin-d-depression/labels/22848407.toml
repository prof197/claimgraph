# Do premenopausal women with major depression have low bone mineral density? A 36-month prospective study.
# PMID 22848407, PLoS One 2012. Publication types: Clinical Trial, Journal Article, Research Support, N.I.H., Intramural.
# Sampled as trial; screened on topic.
#
# BACKGROUND: An inverse relationship between major depressive disorder (MDD) and bone mineral
# density (BMD) has been suggested, but prospective evaluation in premenopausal women is lacking.
# METHODS: Participants of this prospective study were 21 to 45 year-old premenopausal women with
# MDD (n = 92) and healthy controls (n = 44). We measured BMD at the anteroposterior lumbar spine,
# femoral neck, total hip, mid-distal radius, trochanter, and Ward's triangle, as well as serum
# intact parathyroid hormone (iPTH), ionized calcium, plasma adrenocorticotropic hormone (ACTH),
# serum cortisol, and 24-hour urinary-free cortisol levels at 0, 6, 12, 24, and 36 months.
# 25-hydroxyvitamin D was measured at baseline.
# RESULTS: At baseline, BMD tended to be lower in women with MDD compared to controls and BMD
# remained stable over time in both groups. At baseline, 6, 12, and 24 months intact PTH levels
# were significantly higher in women with MDD vs. controls. At baseline, ionized calcium and
# 25-hydroxyvitamin D levels were significantly lower in women with MDD compared to controls. At
# baseline and 12 months, bone-specific alkaline phosphatase, a marker of bone formation, was
# significantly higher in women with MDD vs. controls. Plasma ACTH was also higher in women with
# MDD at baseline and 6 months. Serum osteocalcin, urinary N-telopeptide, serum cortisol, and
# urinary free cortisol levels were not different between the two groups throughout the study.
# CONCLUSION: Women with MDD tended to have lower BMD than controls over time. Larger and longer
# studies are necessary to extend these observations with the possibility of prophylactic therapy
# for osteoporosis.
# TRIAL REGISTRATION: ClinicalTrials.gov NCT 00006180.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "22848407"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "case_control"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 136

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''At baseline, ionized calcium and 25-hydroxyvitamin D levels were significantly lower in women with MDD compared to controls.'''
outcome_reported = "MDD"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
