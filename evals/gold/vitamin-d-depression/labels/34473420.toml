# Effect of omega-3 and vitamin D co-supplementation on psychological distress in reproductive-aged women with pre-diabetes and hypovitaminosis D: A randomized controlled trial.
# PMID 34473420, Brain Behav 2021. Publication types: Journal Article, Randomized Controlled Trial, Research Support, Non-U.S. Gov't.
# Sampled as trial; screened on topic.
#
# PURPOSE: Psychological distresses and pre-diabetes are among the risk factors of developing
# type-II diabetes. The present study was conducted to determine the effectiveness of omega-3 and
# vitamin D co-supplementation on psychological distresses in women of reproductive age with pre-
# diabetes and hypovitaminosis D.
# METHODS: The present factorial clinical trial was conducted on 168 women of reproductive age
# with pre-diabetes and hypovitaminosis D. These participants were selected by stratified random
# sampling and were assigned to four groups for 8 weeks: group 1 (placebo group), group 2 (omega-3
# group), group 3 (vitamin D group), and group 4 (co-supplement group). The medication and placebo
# doses being two 1000-mg tablets each day for omega-3 and 50,000-IU pearls every 2 weeks for
# vitamin D. Fasting blood glucose and vitamin D were measured at the beginning of the study. The
# Depression Anxiety Stress Scale-21 and the Pittsburgh Sleep Quality Index were completed by the
# participants at the start and end of the intervention.
# RESULTS: A significant difference was observed in terms of reduction in anxiety and improvement
# in sleep quality in the co-supplementation compared to the other three groups (p < .05). There
# was also a significant difference between the group receiving both supplements and the group
# receiving only placebos in terms of reduction in depression and stress (p < .05).
# CONCLUSION: Vitamin D and omega-3 co-supplementation improved depression, anxiety, and sleep
# quality in women of reproductive age with pre-diabetes and hypovitaminosis D. Therefore, these
# two supplements can be recommended for improving the mental health of this group of women.
# CLINICAL TRIAL REGISTRY: Iranian Registry of Clinical Trials Code: IRCT20100130003226N17.
# Registered on February 9, 2019.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "34473420"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "rct"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 168

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "yes"
concurrent_comparison = "yes"
by_chance = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''There was also a significant difference between the group receiving both supplements and the group receiving only placebos in terms of reduction in depression and stress (p < .05).'''
outcome_reported = "Depression Anxiety Stress Scale-21"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false
note = "\"hypovitaminosis D\""

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
