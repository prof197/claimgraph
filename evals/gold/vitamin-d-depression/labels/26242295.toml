# The link between obesity and vitamin D in bariatric patients with omega-loop gastric bypass surgery - a vitamin D supplementation trial to compare the efficacy of postoperative cholecalciferol loading (LOAD): study protocol for a randomized controlled trial.
# PMID 26242295, Trials 2015. Publication types: Comparative Study, Journal Article, Randomized Controlled Trial.
# Sampled as off_topic; screened off topic.
#
# BACKGROUND: Beyond its classical role in calcium homoeostasis and bone metabolism, vitamin D
# deficiency has been found to be associated with several diseases, including diabetes, non-
# alcoholic fatty liver disease, and even obesity itself. Importantly, there are limited data on
# therapeutic strategies for vitamin D deficiency in bariatric patients, and the procedure-
# specific guidelines may not be sufficient. To improve long-term outcomes, nutritional screening
# and appropriate supplementation to prevent nutrient deficiencies are urgently needed. Therefore,
# the aim of this study is to examine effects and safety of a forced dosing regimen of vitamin D
# versus conventional dose supplementation on vitamin D levels and other parameters in bariatric
# patients.
# METHODS/DESIGN: The study includes loading plus repeat dosing compared with repeated
# administration of vitamin D without a loading dose, according to guidelines, in a prospective,
# double-blind, randomized controlled trial. Up to a triple oral loading dose is given on day 1,
# then 2 and 4 weeks after surgery (100,000 IU dose each time), followed by an oral maintenance
# dose (3420 IU/day). The control group (n = 25) will receive placebo, followed by administration
# of a standard dose (3420 IU/day). We hypothesize that a significant increase in vitamin D levels
# will occur in patients in the treatment group (n = 25) by 24 weeks after surgery. Further
# measurements are aimed at evaluating changes in inflammation, bone turnover, insulin resistance,
# blood pressure, liver, mental health, and gut microbiota of patients undergoing omega-loop
# gastric bypass surgery. Furthermore, possible associations between concentrations of vitamin D,
# the involved enzymes, or vitamin D receptor in adipose and/or liver tissues will be determined.
# DISCUSSION: To our knowledge, this trial is the first of its kind with this type of vitamin D
# supplementation in bariatric patients. Its major strength is the design and implementation of
# evaluation of influencing factors such as liver function, bone health, inflammation, insulin
# resistance, blood pressure, symptoms of depression, or microbiota. This alternative vitamin D
# dosing regimen has the potential to be a safe, fast, evidence-based treatment of vitamin D
# deficiency in bariatric patients. Owing to the increasing number of bariatric patients, it is
# also of interest to elucidate the link between obesity and vitamin D.
# TRIAL REGISTRATION: ClinicalTrials.gov identifier: NCT02092376 . Registered on 17 March 2014.
#
