# Lifestyle factors, demographics and medications associated with depression risk in an international sample of people with multiple sclerosis.
# PMID 25467385, BMC Psychiatry 2014. Publication types: Journal Article, Research Support, Non-U.S. Gov't.
# Sampled as observational; screened on topic.
#
# BACKGROUND: Depression is the most common co-morbidity for people with Multiple Sclerosis (MS);
# irrespective of disease severity, depression has the greatest impact on quality of life. An
# emerging paradigm in the treatment of depression is lifestyle medicine. There is significant
# potential to prevent and treat depression through modification of lifestyle risk factors for
# people with MS. This study sought to understand the association between lifestyle risk factors,
# medication and depression risk through the analysis of self-reported data from a large
# international sample of people with MS.
# METHODS: This cross-sectional analysis recruited a total of 2459 participants via Web 2.0
# platforms. Survey data included socio-demographics; a range of lifestyle risk factors;
# medication; disease variables and depression risk using the Patient Health Questionnaire-2
# (PHQ-2).
# RESULTS: In total approximately one fifth (19.3%) of our sample screened positive for depression
# (PHQ-2 score ≥3). Several demographic factors were significantly associated with this depression
# risk in bivariate analysis. Regression analyses showed that poor diet, low levels of exercise,
# obesity, smoking, marked social isolation and taking interferon were associated with greater
# depression risk. Participants who supplemented with omega 3s, particularly flaxseed oil, had
# frequent fish consumption, supplemented with vitamin D, meditated, and had moderate alcohol
# consumption had significantly reduced depression risk.
# CONCLUSIONS: This study demonstrates a significant association between modifiable lifestyle
# factors and depression risk. Planned longitudinal follow up may clarify causality. Clinicians
# and people with MS should be aware of the wide range of modifiable lifestyle factors that may
# reduce depression risk as part of a comprehensive secondary and tertiary preventive medical
# approach to managing MS.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "25467385"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "cross_sectional"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 2459

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "no"
measured_before = "no"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''Participants who supplemented with omega 3s, particularly flaxseed oil, had frequent fish consumption, supplemented with vitamin D, meditated, and had moderate alcohol consumption had significantly reduced depression risk.'''
outcome_reported = "PHQ-2"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
