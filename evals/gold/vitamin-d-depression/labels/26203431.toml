# The association of vitamin D deficiency with psychiatric distress and violence behaviors in Iranian adolescents: the CASPIAN-III study.
# PMID 26203431, J Diabetes Metab Disord 2015. Publication types: Journal Article.
# Sampled as observational; screened on topic.
#
# BACKGROUND: Subtle effects of vitamin D deficiency on behavior have been suggested. We
# investigated the association of vitamin D status with mental health and violence behaviors in a
# sample of Iranian adolescents.
# METHODS: This nationwide study was conducted in 2009-2010 in 1095 Iranian school students with
# mean age 14.7 ± 2.6 years. Items were adapted from the Global School-based Student Health Survey
# (GSHS). Psychiatric distress was considered as the self-reported anger, anxiety, poor quality
# sleep, confusion, sadness/depression, worry, and violence-related behaviors (physical fight,
# having bully, or getting bullied).
# RESULTS: Forty percent had serum 25(OH)D values below 10 ng/mL (vitamin D deficient), and 39 %
# had levels 10-30 ng/mL (vitamin D insufficient). The prevalence of self-reported anger, anxiety,
# poor quality sleep, sadness/depression, and worry was significantly lower (P < 0.05) in vitamin
# D sufficient participants compared with their other counterparts. The odds of reporting anger,
# anxiety, poor quality sleep, and worry, increased approximately 1.5 to 1.8 times in vitamin D
# insufficient compared with normal children and adolescents (P < 0.05). Risk estimates indicated
# that vitamin D insufficient and deficient subjects had higher odds of reporting worry compared
# to normal vitamin D group [OR = 2.417 (95 % CI: 1.483-3.940) for vitamin D insufficient
# students, and OR = 2.209 (95 % CI: 1.351-3.611) for vitamin D deficient students] (P-trend =
# 0.001). Violence behaviors did not show any association with vitamin D status (P > 0.05).
# CONCLUSION: Some psychiatric distress such as anger, anxiety, poor quality sleep, depression,
# and worry are associated with hypovitaminosis D in adolescents. The clinical significance of the
# current findings should be determined in future longitudinal studies.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "26203431"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "cross_sectional"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 1095

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "no"
measured_before = "no"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''The prevalence of self-reported anger, anxiety, poor quality sleep, sadness/depression, and worry was significantly lower (P < 0.05) in vitamin D sufficient participants compared with their other counterparts.'''
outcome_reported = "self-reported sadness/depression"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "mixed"
