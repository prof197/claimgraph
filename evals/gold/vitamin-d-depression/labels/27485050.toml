# Vitamin D levels and perinatal depressive symptoms in women at risk: a secondary analysis of the mothers, omega-3, and mental health study.
# PMID 27485050, BMC Pregnancy Childbirth 2016. Publication types: Journal Article, Randomized Controlled Trial.
# Sampled as trial; screened on topic.
#
# BACKGROUND: Vitamin D insufficiency may be associated with depressive symptoms in non-pregnant
# adults. We performed this study to evaluate whether low maternal vitamin D levels are associated
# with depressive symptoms in pregnancy.
# METHODS: This study was a secondary analysis of a randomized trial designed to assess whether
# prenatal omega-3 fatty acid supplementation would prevent depressive symptoms. Pregnant women
# from Michigan who were at risk for depression based on Edinburgh Postnatal Depression Scale
# Score or history of depression were enrolled. Participants completed the Beck Depression
# Inventory (BDI) and Mini International Neuropsychiatric Interview at 12-20 weeks, 26-28 weeks,
# 34-36 weeks, and 6-8 weeks postpartum. Vitamin D levels were measured at 12-20 weeks (N = 117)
# and 34-36 weeks (N = 112). Complete datasets were available on 105 subjects. Using regression
# analyses, we evaluated the relationship between vitamin D levels with BDI scores as well as with
# MINI diagnoses of major depressive disorder and generalized anxiety disorder. Our primary
# outcome measure was the association of maternal vitamin D levels with BDI scores during early
# and late pregnancy and postpartum.
# RESULTS: We found that vitamin D levels at 12-20 weeks were inversely associated with BDI scores
# both at 12-20 and at 34-36 weeks' gestation (P < 0.05, both). For every one unit increase in
# vitamin D in early pregnancy, the average decrease in the mean BDI score was .14 units. Vitamin
# D levels were not associated with diagnoses of major depressive disorder or generalized anxiety
# disorder.
# CONCLUSIONS: In women at risk for depression, early pregnancy low vitamin D levels are
# associated with higher depressive symptom scores in early and late pregnancy. Future
# investigations should study whether vitamin D supplementation in early pregnancy may prevent
# perinatal depressive symptoms.
# TRIAL REGISTRATION: https://clinicaltrials.gov/
# REGISTRATION NUMBER: NCT00711971.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "27485050"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "cross_sectional"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 105

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "no"
measured_before = "no"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''We found that vitamin D levels at 12-20 weeks were inversely associated with BDI scores both at 12-20 and at 34-36 weeks' gestation (P < 0.05, both).'''
outcome_reported = "BDI"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = true
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"

[[finding]]
quote = '''Vitamin D levels were not associated with diagnoses of major depressive disorder or generalized anxiety disorder.'''
outcome_reported = "MDD"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
