# Vitamin D moderates the interaction between 5-HTTLPR and childhood abuse in depressive disorders.
# PMID 33372187, Sci Rep 2020. Publication types: Clinical Trial, Journal Article, Research Support, Non-U.S. Gov't.
# Sampled as trial; screened on topic.
#
# A complex interplay between genetic and environmental factors determines the individual risk of
# depressive disorders. Vitamin D has been shown to stimulate the expression of the tryptophan
# hydroxylase 2 (TPH2) gene, which is the rate-limiting enzyme for serotonin production in the
# brain. Therefore, we investigate the hypothesis that serum vitamin D levels moderate the
# interaction between the serotonin transporter promotor gene polymorphism (5-HTTLPR) and
# childhood abuse in depressive disorders. Two independent samples from the Study of Health in
# Pomerania (SHIP-LEGEND: n = 1 997; SHIP-TREND-0: n = 2 939) were used. Depressive disorders were
# assessed using questionnaires (BDI-II, PHQ-9) and interview procedures (DSM-IV). Besides serum
# vitamin D levels (25(OH)D), a functional polymorphism (rs4588) of the vitamin D-binding protein
# is used as a proxy for 25(OH)D. S-allele carriers with childhood abuse and low 25(OH)D levels
# have a higher mean BDI-II score (13.25) than those with a higher 25(OH)D level (9.56), which was
# not observed in abused LL-carriers. This significant three-way interaction was replicated in
# individuals with lifetime major depressive disorders when using the rs4588 instead of 25(OH)D (p
# = 0.0076 in the combined sample). We conclude that vitamin D relevantly moderates the
# interaction between childhood abuse and the serotonergic system, thereby impacting vulnerability
# to depressive disorders.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "33372187"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "cross_sectional"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 4936

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "no"
proxy_or_event = "no"
selected_by_outcome = "no"
measured_before = "no"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''S-allele carriers with childhood abuse and low 25(OH)D levels have a higher mean BDI-II score (13.25) than those with a higher 25(OH)D level (9.56), which was not observed in abused LL-carriers.'''
outcome_reported = "BDI-II"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = true
# Which part of the sample, as the abstract names it.
subgroup = "s-allele carriers"

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"

[[finding]]
quote = '''S-allele carriers with childhood abuse and low 25(OH)D levels have a higher mean BDI-II score (13.25) than those with a higher 25(OH)D level (9.56), which was not observed in abused LL-carriers.'''
outcome_reported = "BDI-II"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = true
# Which part of the sample, as the abstract names it.
subgroup = "LL-carriers"

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
