# Vitamin D supplementation for treatment of seasonal affective symptoms in healthcare professionals: a double-blind randomised placebo-controlled trial.
# PMID 25125215, BMC Res Notes 2014. Publication types: Journal Article, Randomized Controlled Trial, Research Support, Non-U.S. Gov't.
# Sampled as trial; screened on topic.
#
# BACKGROUND: Low serum 25-hydroxyvitamin D levels (25(OH)D) have been associated with a higher
# likelihood of seasonal affective disorder (SAD) and poor mental well-being, yet firm evidence
# for either remains lacking. Thus, vitamin D supplementation may alleviate symptoms associated
# with SAD.
# METHODS: This study was a randomized, single-centre, double-blind, placebo-controlled trial
# including healthcare professionals employed in psychiatric and somatic hospitals. 3345
# healthcare professionals were invited to participate, 50 participants were screened, and 34 were
# able to complete the study. The main inclusion criterion was 8 points or more on question no. 2
# of the Seasonal Pattern Assessment Questionnaire (SPAQ-SAD). During a 3-month period, the
# participants received a daily dose of 70 μg vitamin D or placebo. The primary outcome was the
# sum of the self-reported questionnaire Structured Interview Guide for the Hamilton Depression
# Rating Scale, Seasonal Affective Disorders (SIGH-SAD). The secondary outcome was World Health
# Organization-Five Well-Being Index (WHO-5) of the healthcare professionals during the winter
# period and the exploratory outcome measures were weight, waist circumference, blood pressure,
# absenteeism from work and 25(OH)D.
# RESULTS: There were no significant between-group differences in SIGH-SAD sums at 12 weeks (p =
# 0.7 (CI: - 3.27 to 4.81)). However, there was a significant improvement of primary SIGH-SAD over
# time from inclusion (autumn-winter) to the completion of the study (winter-spring) for all
# participants. The secondary and exploratory outcome measures were all insignificant between
# groups.The sums of the SIGH-SAD at 12 weeks were not significantly different [p = 0.701 (CI:
# 4.81-3.27)] between the groups. There was, however, a significant improvement in primary SIGH-
# SAD sums over time from inclusion (autumn-winter) to the completion of the study (winter-spring)
# in both groups. The secondary and explorative outcome measures were not significantly different
# between groups.
# CONCLUSIONS: There were no significant between-group differences in the primary (SIGH-SAD) and
# secondary (WH0-5) as well as the exploratory outcome measures (weight, waist circumference,
# blood pressure, absenteeism from work and 25(OH)D. Thus, the study failed to demonstrate an
# effect of vitamin D on SAD symptoms, but our findings may be limited by confounders.
# Furthermore, the study was underpowered and did not allow us to assess the ability of vitamin D
# to improve mood in those with low 25(OH)D.
# TRIAL REGISTRATION: ( http://www.clinicaltrials.gov registration number: NCT01462058).
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "25125215"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "rct"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 34

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "yes"
concurrent_comparison = "yes"
by_chance = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''There were no significant between-group differences in SIGH-SAD sums at 12 weeks (p = 0.7 (CI: - 3.27 to 4.81)).'''
outcome_reported = "SIGH-SAD"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = true
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
