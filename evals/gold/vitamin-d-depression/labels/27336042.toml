# Does environmental confounding mask pleiotropic effects of a multiple sclerosis susceptibility variant on vitamin D in psychosis?
# PMID 27336042, NPJ Schizophr 2015. Publication types: Journal Article.
# Sampled as off_topic; screened off topic.
#
# BACKGROUND: This work addresses the existing and emerging evidence of overlap within the
# environmental and genetic profiles of multiple sclerosis (MS) and schizophrenia.
# AIMS: To investigate whether a genetic risk factor for MS (rs703842), whose variation is
# indicative of vitamin D status in the disorder, could also be a determinant of vitamin D status
# in chronic psychosis patients.
# METHODS: A cohort of 224 chronic psychosis cases was phenotyped and biologically profiled. The
# relationship between rs703842 and physiological vitamin D status in the blood plasma was
# assessed by logistic regression. Deficiency was defined as a blood plasma concentration below 10
# ng/µl. Potential environmental confounders of the vitamin D status were considered as part of
# the analysis.
# RESULTS: We report suggestive evidence of an association with vitamin D status in established
# psychosis (ß standardized=0.51, P=0.04). The logistic model fit significantly benefited from
# controlling for body mass index, depression and ethnicity (χ (2)=91.7; 2 degrees of freedom
# (df); P=1.2×10(20)).
# CONCLUSIONS: The results suggest that, in addition to lifestyle changes that accompany the onset
# of illness, vitamin D dysregulation in psychosis has a genetic component that links into MS.
# Further, comprehensive studies are needed to evaluate this prospect.
#
