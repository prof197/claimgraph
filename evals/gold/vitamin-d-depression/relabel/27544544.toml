# A randomized controlled trial of vitamin D supplementation on perinatal depression: in Iranian pregnant mothers.
# PMID 27544544, BMC Pregnancy Childbirth 2016. Publication types: Journal Article, Randomized Controlled Trial.
# Sampled as trial; screened on topic.
#
# BACKGROUND: Mood disorders in pregnancy and post-partum period are common and considered as a
# public health issue. Researchers have studied the relationship between low serum vitamin D
# concentration and perinatal depression, although no clinical trial has been conducted on vitamin
# D's effects on depression related to childbirth. This study evaluated the effect of vitamin D3
# supplementation on perinatal depression scores.
# METHODS: This randomized clinical trial was done in pregnant women who were under prenatal care
# in a teaching hospital in Shiraz, Iran. The inclusion criteria were: being 18 years or older, no
# history of mental illness and internal diseases, a singleton live fetus, without any pregnancy
# complications, gestational age of 26-28 weeks upon enrollment, and depression score of 0 to 13.
# The Edinburgh Postnatal Depression scale was used to evaluate depression scores. A total of 169
# participants were assigned to the two groups of placebo and vitamin D through block
# randomization design. Vitamin D group received 2000 IU vitamin D3 daily from 26 to 28 weeks of
# gestation until childbirth. Maternal serum 25-hydroxyvitamin D concentrations were measured at
# baseline and childbirth. Besides, depression scores were evaluated four times: at 26-28 and
# 38-40 weeks of gestation, and finally at 4 and 8 weeks after birth.
# RESULTS: The two groups were similar in relation to baseline 25-hydroxyvitamin D concentrations.
# However, at childbirth, the vitamin D group had significantly higher 25-hydroxyvitamin D
# concentration in comparison to the control group (p < 0.001). At baseline, no correlation was
# observed between 25-hydroxyvitamin D concentration and depression score (r = 0.13, p = 0.09).
# There was no significant difference between the two study groups in relation to the baseline
# depression score. While, the vitamin D group had greater reduction in depression scores than the
# control group at 38-40 weeks of gestation (p = 0.01) also, at 4 and 8 weeks after birth (p <
# 0.001).
# CONCLUSIONS: The present trial showed that consuming 2000 IU vitamin D3 daily during late
# pregnancy was effective in decreasing perinatal depression levels. We suggest further clinical
# trial in pregnant mothers who are at risk for postnatal depression.
# TRIAL REGISTRATION: Iranian Registry of Clinical Trials IRCT2015020310327N11 . Date of
# registration: March 9th 2015.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "27544544"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "rct"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = 169

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "yes"
concurrent_comparison = "yes"
by_chance = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''While, the vitamin D group had greater reduction in depression scores than the control group at 38-40 weeks of gestation (p = 0.01) also, at 4 and 8 weeks after birth (p < 0.001).'''
outcome_reported = "Edinburgh Postnatal Depression scale"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "decreased"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
