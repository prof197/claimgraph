# Vitamin D supplementation improves anxiety but not depression symptoms in patients with vitamin D deficiency.
# PMID 32945627, Brain Behav 2020. Publication types: Journal Article, Randomized Controlled Trial, Research Support, Non-U.S. Gov't.
# Sampled as trial; screened on topic.
#
# OBJECTIVE: Epidemiological evidence indicated a relationship between vitamin D (VD) and
# depression with anxiety, but their therapeutic relationship has not been fully elucidated. This
# study aimed to examine whether VD supplementation would relieve symptoms in patients with
# depression and anxiety with low serum 25-hydroxy VD [25(OH) D] levels.
# METHOD: Participants with low 25(OH)D levels were randomized to control or daily VD group and
# were followed up for 6 months. Serum concentrations of 25(OH) D were measured using commercial
# kits. Psychological symptoms were evaluated with the Hamilton Depression Rating Scale-17
# (HAMD-17), Revised Social Anhedonia Scale (RSAS), Revised Physical Anhedonia scale (RPAS), and
# Hamilton Anxiety Rating Scale-14 (HAMA-14). The trial was listed in the trial registration
# (http://www.medresman.org.cn/uc/index.aspx; NTR number: ChiCTR2000030130).
# RESULTS: In this clinical population, no significant difference in depression symptoms was
# detected between VD group and control group at both baseline and at the endpoint of our study.
# The HAMD-17, RSAS, and RPAS scores did not change significantly between VD and control groups
# from baseline to endpoint (all p > .05). However, there was a significant difference in time
# effect of the total HAMA-14 scores between the two groups (β [95% Cl] = -2.235 [-3.818, -0.653],
# p = .006).
# CONCLUSIONS: Vitamin D supplementation could improve the anxiety symptoms but not depressive
# symptoms in depressive patients with low VD level after the 6-month intervention.
#
# Fill in every value; evals/gold/LABELING.md explains each one.

pmid = "32945627"
# design: rct, non_randomized_trial, cohort, case_control, cross_sectional, case_series,
# systematic_review, meta_analysis, narrative_review, case_report, animal, in_vitro, other
design = "rct"
# Enrolled or randomized, not analyzed; "not_reported" if the abstract does not say.
sample_size = "not_reported"

# Answers to the design questions in LABELING.md, in order; they settle the design.
[design_answers]
subjects = "people"
source = "own_data"
individual_patients = "no"
gave_exposure = "yes"
concurrent_comparison = "yes"
by_chance = "yes"

# One block per finding in the outcome domain; delete the block if there are none.
[[finding]]
quote = '''In this clinical population, no significant difference in depression symptoms was detected between VD group and control group at both baseline and at the endpoint of our study.'''
outcome_reported = "MAND-17"
# increased, decreased or no_change, with more vitamin D as the exposure side.
effect = "no_change"
# true only when the abstract calls it the primary outcome; never for a subgroup.
is_primary = false
# true when the result covers only part of the analyzed sample, such as one sex.
is_subgroup = false

[finding.dimensions]
# baseline_vitamin_d_status: below_20_ng_ml, at_or_above_20_ng_ml, mixed, not_reported
baseline_vitamin_d_status = "not_reported"
