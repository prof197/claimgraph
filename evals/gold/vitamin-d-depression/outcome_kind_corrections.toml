# Corrections to the outcome kinds after labeling: what each string was, what it is now, the
# rule, and how the correction was found. The normalization eval undoes the corrections a
# proposal's own disagreements turned up, to report its score before and after them.

[[correction]]
string = "elevated depressive symptoms (CES-D)"
was = "score"
now = "case_status"
found = "pair_verdicts"
rule = "\"Elevated\" is a case-status word"

[[correction]]
string = "elevated depressive symptoms (8-point CES-D)"
was = "score"
now = "case_status"
found = "pair_verdicts"
rule = "\"Elevated\" is a case-status word"

[[correction]]
string = "reduction of depressive symptoms"
was = "response"
now = "score"
found = "pair_verdicts"
rule = "\"Reduction\" is a score word without a percentage threshold"

