[project]
name = "claimgraph"
version = "0.1.0"
description = "Extract findings from PubMed abstracts on one health question and explain why studies disagree."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "typer>=0.27",
]

[project.scripts]
claimgraph = "claimgraph.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
