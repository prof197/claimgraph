[project]
name = "claimgraph"
version = "1.1.2"
description = "Extract findings from PubMed abstracts on one health question and explain why studies disagree."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Claimgraph contributors" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "httpx>=0.28",
    "networkx>=3.7",
    "pydantic>=2.14",
    "typer>=0.27",
]

[project.optional-dependencies]
# The council arms' other vendors, pinned exactly. Only those arms import them.
council = [
    "google-genai==2.34.0",
    "openai==3.42.1",
]

[project.scripts]
claimgraph = "claimgraph.cli:app"

[dependency-groups]
dev = [
    # The checks type the council arms, so development installs their SDKs.
    "claimgraph[council]",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-networkx==3.6.1.20261031",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.uv]
# Dependencies are taken at releases at least two weeks old; this holds back the one the
# council SDKs pulled in newer than that.
constraint-dependencies = ["google-auth<=2.62.0"]
