  "global cognition",
  "memory",
  "attention",
  "executive function",
  "processing speed",
]
# Supplementation, not creatine as a lab marker such as creatine kinase.
filters = ['''supplement*[tiab] OR "dietary supplements"[MeSH]''']
end_date = 2026-10-31
