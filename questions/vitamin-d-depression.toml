id = "vitamin-d-depression"
title = "Does vitamin D affect depression?"
# The topic query: any exposure term AND any outcome term, in the title or abstract.
exposure_terms = [
  "vitamin D",
  "vitamin D3",
  "vitamin D2",
  "cholecalciferol",
  "ergocalciferol",
  "calcifediol",
  "25-hydroxyvitamin D",
  "25-hydroxyvitamin D3",
  "25(OH)D",
]
outcome_terms = ["depress*", "seasonal affective disorder"]
topic_match = "title_abstract"
# Added to the terms in title_abstract scope. "Vitamin D" also covers cholecalciferol,
# ergocalciferols and calcifediol beneath it; "Mood Disorders" covers depressive disorders.
exposure_mesh = ["Vitamin D"]
outcome_mesh = ["Depression", "Mood Disorders"]
# Findings on other outcomes are counted as out of scope, not stored.
outcome_domain = [
  "depressive symptoms",
  "depression diagnosis or incidence",
  "remission",
  "response",
  "seasonal affective disorder",
]
# The ruled normalization hard cases: "depressive symptoms", "PHQ-9 score" and "depression
# severity" are scores and merge; "depression", a bare condition, and "incident depression" are
# case status and merge; scores and case status do not. The corpus words incidence as
# "incident depression".
outcome_hard_cases = [
  "depressive symptoms",
  "depression",
  "PHQ-9 score",
  "incident depression",
  "depression severity",
]
filters = [
  # Not research: editorials, letters, comments, news, errata and retraction notices.
  '''all[sb] NOT (editorial[pt] OR letter[pt] OR comment[pt] OR news[pt] OR "published erratum"[pt] OR "retraction of publication"[pt])''',
  # Animal-only studies. Records not yet indexed with MeSH carry neither heading and are kept.
  '''all[sb] NOT (animals[mh] NOT humans[mh])''',
]
end_date = 2026-10-31

[[dimensions]]
name = "baseline_vitamin_d_status"
type = "options"
refines = "population"
options = ["below_20_ng_ml", "at_or_above_20_ng_ml", "mixed", "not_reported"]
definition = """\
Baseline serum 25-hydroxyvitamin D band of this finding's population, cut at 20 ng/mL \
(50 nmol/L), the deficiency cut-off in the Endocrine Society's 2011 guideline; its 2024 \
guideline endorses no thresholds, so the cut-off only groups studies. below_20_ng_ml: strictly \
below 20 ng/mL (50 nmol/L). at_or_above_20_ng_ml: 20 ng/mL (50 nmol/L) or higher; exactly 20 \
ng/mL (50 nmol/L) is at_or_above_20_ng_ml. A subgroup finding takes its subgroup's band. \
Assign the band by precedence: (a) if the population was restricted by vitamin D status at \
eligibility, use that restriction, but only when its whole range is strictly below 20 ng/mL \
(50 nmol/L) or at or above it, in either unit; a restriction that includes values on both \
sides, such as ≤20 ng/mL, ≤50 nmol/L, <30 ng/mL or <75 nmol/L, does not settle the band; a \
restriction that settles it applies to every finding in the study, subgroups included; (b) \
otherwise, use the baseline mean or median the abstract reports for that population; a mean or \
median for the whole sample does not carry over to a subgroup; (c) use mixed only when the \
abstract reports values on both sides of 20 ng/mL with no single summary for that population; \
(d) otherwise not_reported. Words such as low, deficient or hypovitaminosis D without a number \
do not settle the band."""
