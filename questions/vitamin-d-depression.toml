id = "vitamin-d-depression"
title = "Does vitamin D affect depression?"
query = '''("Vitamin D"[MeSH] OR "vitamin D"[tiab] OR cholecalciferol[tiab] OR ergocalciferol[tiab] OR "25-hydroxyvitamin D"[tiab]) AND (Depression[MeSH] OR "Depressive Disorder"[MeSH] OR depress*[tiab])'''
# Set once the unfiltered record count has been measured.
filters = []
end_date = 2026-10-31

[[dimensions]]
name = "baseline_vitamin_d_status"
type = "options"
refines = "population"
options = ["below_20_ng_ml", "at_or_above_20_ng_ml", "mixed", "not_reported"]
definition = """\
Baseline serum 25-hydroxyvitamin D band of this finding's population, cut at 20 ng/mL \
(50 nmol/L), the deficiency cut-off in the Endocrine Society's 2011 guideline; its 2024 \
guideline endorses no thresholds, so the cut-off only groups studies. A subgroup finding takes \
its subgroup's band. Assign the band by precedence: (a) if the population was restricted by \
vitamin D status at eligibility, use that restriction; (b) otherwise, use the baseline mean or \
median the abstract reports for that population; (c) use mixed only when the abstract reports \
values on both sides of 20 ng/mL with no single summary for that population; (d) otherwise \
not_reported. below_20_ng_ml: below 20 ng/mL (50 nmol/L). at_or_above_20_ng_ml: 20 ng/mL \
(50 nmol/L) or higher."""
