# Outcome mapping for creatine-cognition: each outcome lists the outcome strings findings report
# that measure it. Findings are compared only within one outcome.
#
# Proposed by claude-sonnet-5-5 over 79 strings. Review each outcome: move
# strings that measure something else, fix the name and higher_is_better, then set
# reviewed = true. Strings outside the question's domain go to the out_of_domain list,
# before the first outcome, so their findings are dropped and counted.

[[outcomes]]
name = "global cognition"
higher_is_better = true
reviewed = false
members = [
  "cognition",
  "cognitive function",
  "cognitive function (MOCA)",
  "cognitive functions",
  "cognitive improvement (neuropsychological evaluation)",
  "cognitive manifestations",
  "cognitive performance",
  "cognitive performance (battery of tests involving memory, selective attention, and inhibitory control)",
  "cognitive performance (processing speed, episodic memory, attention test battery)",
  "MOCA, word recall and executive function outcomes",
  "neurocognitive measures (cognitive battery)",
  "NIH Toolbox fluid cognition composite",
  "NIH Toolbox global cognition composite",
  "selected markers of cognitive function and memory",
]

